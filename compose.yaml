services:
  mysql:
    image: mysql:8.4
    container_name: easymall-mysql
    environment:
      MYSQL_DATABASE: easymall
      MYSQL_USER: easymall
      MYSQL_PASSWORD: easymall123
      MYSQL_ROOT_PASSWORD: root123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - easymall-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  easymall-mysql-data:
