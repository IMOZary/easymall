spring:
  datasource:
    url: jdbc:h2:mem:easymall-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: false
  h2:
    console:
      enabled: false
easymall:
  order:
    timeout-scan-ms: 3600000
