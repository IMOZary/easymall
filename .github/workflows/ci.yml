name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: easymall
          MYSQL_USER: easymall
          MYSQL_PASSWORD: easymall123
          MYSQL_ROOT_PASSWORD: root123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot123"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Unit and integration tests
        run: mvn -B verify

      - name: MySQL migration smoke test
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/easymall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
          DB_USERNAME: easymall
          DB_PASSWORD: easymall123
        run: |
          java -jar target/easymall-1.0.0.jar --spring.profiles.active=mysql > app.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/api/categories > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat app.log
          exit 1
